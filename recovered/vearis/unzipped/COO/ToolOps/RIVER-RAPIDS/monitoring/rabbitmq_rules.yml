groups:
  - name: rabbitmq_alerts
    rules:
      # Queue Metrics
      - alert: QueueDepthHigh
        expr: rabbitmq_queue_messages > 10000
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "Queue depth exceeds warning threshold"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages"

      - alert: QueueDepthCritical
        expr: rabbitmq_queue_messages > 50000
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Queue depth exceeds critical threshold"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages"

      # Message Rate
      - alert: MessageRateHigh
        expr: rate(rabbitmq_queue_messages_published_total[1m]) > 1000
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "Message rate exceeds warning threshold"
          description: "Queue {{ $labels.queue }} publishing rate is {{ $value }} msg/s"

      - alert: MessageRateCritical
        expr: rate(rabbitmq_queue_messages_published_total[1m]) > 5000
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Message rate exceeds critical threshold"
          description: "Queue {{ $labels.queue }} publishing rate is {{ $value }} msg/s"

      # Consumer Count
      - alert: LowConsumerCount
        expr: rabbitmq_queue_consumers < 2
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "Low consumer count"
          description: "Queue {{ $labels.queue }} has only {{ $value }} consumers"

      - alert: NoConsumers
        expr: rabbitmq_queue_consumers == 0
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "No consumers"
          description: "Queue {{ $labels.queue }} has no consumers"

      # Resource Usage
      - alert: HighMemoryUsage
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.70
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "High memory usage"
          description: "RabbitMQ memory usage at {{ $value | humanizePercentage }}"

      - alert: CriticalMemoryUsage
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.85
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Critical memory usage"
          description: "RabbitMQ memory usage at {{ $value | humanizePercentage }}"

      # Disk Space
      - alert: LowDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/var/lib/rabbitmq"} < 5e9
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "Low disk space"
          description: "RabbitMQ disk space below 5GB"

      - alert: CriticalDiskSpace
        expr: node_filesystem_avail_bytes{mountpoint="/var/lib/rabbitmq"} < 2e9
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Critical disk space"
          description: "RabbitMQ disk space below 2GB"

      # Connection Metrics
      - alert: HighConnectionCount
        expr: rabbitmq_connections > rabbitmq_connection_limit * 0.8
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "High connection count"
          description: "Connection count at {{ $value | humanizePercentage }} of limit"

      - alert: CriticalConnectionCount
        expr: rabbitmq_connections > rabbitmq_connection_limit * 0.9
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Critical connection count"
          description: "Connection count at {{ $value | humanizePercentage }} of limit"

      # Virtual Host Metrics
      - alert: VHostQueueCountHigh
        expr: sum by (vhost) (rabbitmq_queue_messages) > 100
        for: 5m
        labels:
          severity: warning
          channel: '#rabbitmq-team'
        annotations:
          summary: "High queue count in vhost"
          description: "VHost {{ $labels.vhost }} has {{ $value }} queues"

      - alert: VHostQueueCountCritical
        expr: sum by (vhost) (rabbitmq_queue_messages) > 200
        for: 2m
        labels:
          severity: critical
          channel: '#rmq-911'
        annotations:
          summary: "Critical queue count in vhost"
          description: "VHost {{ $labels.vhost }} has {{ $value }} queues"