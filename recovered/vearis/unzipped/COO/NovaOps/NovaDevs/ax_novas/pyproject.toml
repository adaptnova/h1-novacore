[project]
name = "nova"
version = "0.1.0"
description = "Nova Autonomous Orchestrator"
requires-python = ">=3.11"
authors = [
    {name = "Kairos", email = "kairos@adapt.ai"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=14.0",
    "langchain>=0.3.0",
    "sentence-transformers>=3.3.0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.4",
    "pymilvus>=2.2.8",
    "redis>=5.0.0",
    "pymongo>=4.5.0",
    "pika>=1.3.1",
    "confluent-kafka>=2.2.0",
    "PyMuPDF>=1.22.3",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.2",
    "python-magic>=0.4.27",
    "beautifulsoup4>=4.12.2",
    "markdown>=3.4.3",
    "pyarrow>=12.0.1",
    "h5py>=3.9.0",
    "zarr>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nova"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=nova --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[project.urls]
Homepage = "https://adapt.ai"
Documentation = "https://docs.adapt.ai/nova"
Repository = "https://github.com/adapt-ai/nova"
