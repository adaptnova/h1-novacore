[pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio settings
asyncio_mode = auto

# Logging settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=nova
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --no-cov-on-fail

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    security: marks tests as security tests
    performance: marks tests as performance tests

# Environment variables
env =
    NOVA_ENVIRONMENT=testing
    NOVA_TESTING=true
    NOVA_LOG_LEVEL=DEBUG

# Test categories to run by default
# Use -m "not integration" to skip integration tests
# Use -m "not slow" to skip slow tests
# Use -m "unit" to run only unit tests
default_markers =
    not integration
    not slow

# Disable warnings from third-party packages
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning

# Test timeout (in seconds)
timeout = 300

# Maximum line length for test files
max_line_length = 100

# Parallel execution settings
# Use -n auto for automatic detection of CPU cores
# Use -n <number> for specific number of workers
addopts = -n auto

# Directory for temporary test files
tmp_path_retention_count = 3
tmp_path_retention_policy = failed

# Custom test summary
terminal_summary = true

# Show local variables in tracebacks
showlocals = true

# Fail on first error
fail_fast = false
