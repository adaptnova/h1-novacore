[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test categories
markers =
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running

# Logging settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test execution settings
addopts = 
    --verbose
    --strict-markers
    -ra
    --tb=short
    --cov=src/haystack_rag
    --cov-report=term-missing
    --cov-report=html
    --no-cov-on-fail

# Environment variables for testing
env =
    API_HOST=localhost
    API_PORT=8000
    API_WORKERS=1
    API_KEY=test-api-key
    LOG_LEVEL=DEBUG
    ENABLE_TRACING=false
    METRICS_PORT=9090
    CACHE_TTL=3600
    RATE_LIMIT=100

# Disable warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Test discovery
norecursedirs = 
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    venv
    env
