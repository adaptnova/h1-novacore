# NovaOps Monitoring Requirements
# Date: January 10, 2025 23:48 MST
# Team: NovaOps
# Component: Core Operations

monitoring_requirements:
  system_metrics:
    cpu_monitoring:
      type: per_agent
      metrics:
        - usage_percent
        - load_average
        - thread_count
      threshold:
        warning: 80
        critical: 90
      interval: 30s

    memory_monitoring:
      type: per_agent
      metrics:
        - usage_percent
        - available_bytes
        - swap_usage
      threshold:
        warning: 85
        critical: 95
      interval: 30s

    disk_monitoring:
      type: nvme_performance
      metrics:
        - iops
        - latency
        - throughput
        - available_space
      threshold:
        space_warning: 80
        space_critical: 90
        latency_warning: 100ms
        latency_critical: 200ms
      interval: 1m

  network_metrics:
    gvnic_monitoring:
      type: per_interface
      metrics:
        - bandwidth_usage
        - packet_loss
        - error_rate
      threshold:
        bandwidth_warning: 70
        bandwidth_critical: 85
        error_rate_warning: 0.001
        error_rate_critical: 0.01
      interval: 30s

  nova_specific:
    agent_monitoring:
      type: per_nova
      metrics:
        - message_queue_length
        - response_time
        - error_rate
        - active_connections
      threshold:
        queue_warning: 1000
        queue_critical: 5000
        response_warning: 100ms
        response_critical: 500ms
      interval: 15s

    framework_monitoring:
      type: per_framework
      metrics:
        - active_agents
        - message_throughput
        - memory_usage
        - cpu_usage
      threshold:
        agent_warning: 80%
        agent_critical: 90%
        throughput_warning: 5000msg/s
        throughput_critical: 10000msg/s
      interval: 30s

  communication_metrics:
    red_stream_monitoring:
      type: stream_performance
      metrics:
        - message_rate
        - latency
        - error_rate
        - consumer_lag
      threshold:
        latency_warning: 50ms
        latency_critical: 200ms
        error_rate_warning: 0.001
        error_rate_critical: 0.01
      interval: 15s

    red_mem_monitoring:
      type: memory_performance
      metrics:
        - operation_rate
        - hit_ratio
        - memory_usage
        - eviction_rate
      threshold:
        hit_ratio_warning: 0.95
        hit_ratio_critical: 0.90
        memory_warning: 80%
        memory_critical: 90%
      interval: 30s

alerts:
  critical:
    - condition: "cpu_usage > 90% for 5m"
      action: "notify_nova_911"
    - condition: "memory_usage > 95% for 5m"
      action: "notify_nova_911"
    - condition: "disk_space > 90%"
      action: "notify_nova_911"
    - condition: "error_rate > 0.01 for 1m"
      action: "notify_nova_911"

  warning:
    - condition: "cpu_usage > 80% for 10m"
      action: "notify_novaops_team"
    - condition: "memory_usage > 85% for 10m"
      action: "notify_novaops_team"
    - condition: "response_time > 100ms for 5m"
      action: "notify_novaops_team"

dashboards:
  - name: "NovaOps Overview"
    panels:
      - "System Health"
      - "Nova Agent Status"
      - "Framework Performance"
      - "Communication Metrics"
  
  - name: "Framework Integration"
    panels:
      - "Framework Status"
      - "Message Flow"
      - "Resource Usage"
      - "Error Rates"

  - name: "Communication Health"
    panels:
      - "Red-Stream Performance"
      - "Red-Mem Status"
      - "Message Latency"
      - "Consumer Groups"

launch_critical: true
priority: high
update_frequency: real-time