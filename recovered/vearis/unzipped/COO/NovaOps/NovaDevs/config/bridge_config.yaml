# Nova Framework Bridge Configuration

# System Configuration
system:
  environment: "production"
  version: "1.0.0"
  log_level: "INFO"
  max_concurrent_operations: 100
  operation_timeout: 30 # seconds
  cleanup_interval: 3600 # seconds
  max_operation_age: 86400 # seconds (24 hours)

# Memory Systems
memory:
  short_term:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 0
    max_memory: "2gb"
    eviction_policy: "allkeys-lru"

  long_term:
    type: "mongodb"
    uri: "mongodb://localhost:27017"
    database: "nova_memory"
    collections:
      - "episodic"
      - "semantic"
      - "procedural"

  semantic:
    type: "neo4j"
    uri: "bolt://localhost:7687"
    database: "nova_knowledge"
    max_connections: 50
    connection_timeout: 5

# Knowledge Systems
knowledge:
  graph:
    type: "neo4j"
    uri: "bolt://localhost:7687"
    database: "nova_knowledge"
    max_connections: 50
    connection_timeout: 5

  vector:
    type: "milvus"
    host: "localhost"
    port: 19530
    collections:
      - "memory_vectors"
      - "knowledge_vectors"
      - "semantic_vectors"

  document:
    type: "mongodb"
    uri: "mongodb://localhost:27017"
    database: "nova_docs"
    collections:
      - "documents"
      - "metadata"
      - "versions"

# Reasoning Systems
reasoning:
  logical:
    implementation: "prolog"
    max_depth: 100
    timeout: 5
    cache_size: 1000

  probabilistic:
    implementation: "bayesian"
    max_variables: 1000
    inference_timeout: 10
    cache_results: true

  analogical:
    implementation: "structure_mapping"
    max_mappings: 100
    similarity_threshold: 0.7
    cache_mappings: true

# Framework Bridges
bridges:
  ax_nova:
    enabled: true
    version: "1.0.0"
    max_retries: 3
    retry_delay: 1.0
    supported_operations:
      - "agent_communication"
      - "memory_access"
      - "tool_execution"
      - "cognitive_operations"
      - "knowledge_operations"
      - "reasoning_operations"

  langgraph:
    enabled: true
    version: "1.0.0"
    max_retries: 3
    retry_delay: 1.0
    supported_operations:
      - "graph_operations"
      - "workflow_execution"
      - "state_management"

  autogen:
    enabled: true
    version: "1.0.0"
    max_retries: 3
    retry_delay: 1.0
    supported_operations:
      - "agent_execution"
      - "conversation_management"
      - "task_planning"

# Message Brokers
messaging:
  kafka:
    bootstrap_servers: "localhost:9092"
    topics:
      - "agent_commands"
      - "agent_events"
      - "system_metrics"
      - "task_queue"

  rabbitmq:
    host: "localhost"
    port: 5672
    queues:
      - "direct_messages"
      - "task_distribution"
      - "result_collection"

# Security
security:
  authentication:
    method: "token_based"
    token_expiry: 3600
    refresh_enabled: true

  authorization:
    model: "role_based"
    default_role: "agent"

  encryption:
    in_transit: true
    at_rest: true
    key_rotation: 86400

# Monitoring
monitoring:
  metrics:
    collection_interval: 10
    retention_period: 604800 # 7 days
    exporters:
      - "prometheus"
      - "influxdb"

  logging:
    level: "INFO"
    format: "json"
    retention: 30 # days
    destinations:
      - "file"
      - "elasticsearch"

  alerting:
    enabled: true
    channels:
      - "email"
      - "slack"
    thresholds:
      error_rate: 0.01
      latency_ms: 1000
      memory_usage: 0.9

# Performance
performance:
  caching:
    enabled: true
    backend: "redis"
    ttl: 3600
    max_size: "1gb"

  batching:
    enabled: true
    max_size: 100
    timeout: 1.0

  rate_limiting:
    enabled: true
    max_requests: 1000
    window_size: 60

# Resource Management
resources:
  cpu:
    limit_percentage: 80
    throttle_threshold: 90

  memory:
    limit_percentage: 75
    swap_threshold: 85

  storage:
    min_free_space: "10gb"
    cleanup_threshold: "5gb"

# Development
development:
  debug: false
  hot_reload: false
  test_mode: false
  mock_services: false
