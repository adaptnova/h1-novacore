name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
        Please fill out the form below with as much detail as possible.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature Type
      description: What type of feature are you suggesting?
      options:
        - New Framework Integration
        - New Bridge Capability
        - Performance Enhancement
        - Developer Experience
        - Documentation
        - Testing/CI
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Related Framework
      description: Which framework is this feature related to?
      options:
        - AxNova
        - LangGraph
        - AutoGen
        - Multiple/All
        - New Framework
        - Not Framework-Specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Details
      description: If you have thoughts on how to implement this feature, please share them
      placeholder: |
        Technical considerations:
        - Architecture changes needed
        - New dependencies required
        - Potential impact on existing features
        - Performance implications

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here
      placeholder: |
        - Use cases
        - Screenshots
        - References to similar features in other projects
        - Links to relevant documentation or research

  - type: checkboxes
    id: requirements
    attributes:
      label: Feature Requirements
      description: Please confirm the following
      options:
        - label: This feature aligns with the project's goals and scope
          required: true
        - label: I have searched for similar feature requests
          required: true
        - label: I am willing to contribute to the implementation
          required: false
        - label: I can help with testing this feature
          required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking work)
        - High (Major improvement)
        - Medium (Nice to have)
        - Low (Minor enhancement)
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline Considerations
      description: Are there any timeline considerations for this feature?
      placeholder: |
        - Is this time-sensitive?
        - Are there dependencies on other features or projects?
        - Do you have a target date in mind?

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this feature request, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I understand that feature requests may not be implemented immediately
          required: true