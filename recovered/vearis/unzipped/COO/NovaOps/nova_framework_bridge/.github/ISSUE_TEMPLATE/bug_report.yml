name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please fill out the form below with as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Nova Framework Bridge are you running?
      placeholder: e.g., v1.0.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where are you running Nova Framework Bridge?
      options:
        - Development
        - Staging
        - Production
        - Testing
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework Integration
      description: Which framework integration is affected?
      options:
        - AxNova
        - LangGraph
        - AutoGen
        - Multiple/All
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Configure '...'
        2. Initialize with '...'
        3. Run command '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Please provide your configuration (with sensitive data removed)
      render: yaml

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: Please provide information about your system
      value: |
        - OS: [e.g., Ubuntu 20.04]
        - Python Version: [e.g., 3.8.10]
        - Docker Version (if applicable): [e.g., 20.10.7]
        - Database Versions:
          - Redis: [e.g., 6.2]
          - MongoDB: [e.g., 5.0]
          - Neo4j: [e.g., 4.4]
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I have searched for similar issues before creating this one
          required: true
        - label: I have provided all the requested information
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here