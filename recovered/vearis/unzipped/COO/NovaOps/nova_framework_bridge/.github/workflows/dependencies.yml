name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Monday
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create branch for updates
        run: |
          BRANCH="dependency-updates-$(date +'%Y%m%d')"
          git checkout -b $BRANCH
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Update dependencies
        run: |
          poetry update

          # Check if there are any changes
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "CHANGES_EXIST=true" >> $GITHUB_ENV
          else
            echo "CHANGES_EXIST=false" >> $GITHUB_ENV
          fi

      - name: Run tests with updated dependencies
        if: env.CHANGES_EXIST == 'true'
        run: |
          poetry run pytest

      - name: Create Pull Request
        if: env.CHANGES_EXIST == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: update dependencies'
          body: |
            This PR updates project dependencies to their latest compatible versions.

            Changes:
            ```diff
            $(git diff --unified=0 poetry.lock)
            ```

            This PR was created automatically by the dependency update workflow.
          branch: ${{ env.BRANCH }}
          base: main
          labels: dependencies
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
          draft: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install safety bandit

      - name: Run safety check
        run: |
          safety check
          if [ $? -eq 0 ]; then
            echo "No known security vulnerabilities found"
          else
            echo "::warning ::Security vulnerabilities found"
          fi

      - name: Run bandit
        run: |
          bandit -r src
          if [ $? -eq 0 ]; then
            echo "No security issues found"
          else
            echo "::warning ::Security issues found"
          fi

  outdated-check:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Check outdated dependencies
        run: |
          poetry show --outdated
          if [ $? -eq 0 ]; then
            echo "No outdated dependencies found"
          else
            echo "::warning ::Outdated dependencies found"
          fi

  dependency-graph:
    name: Update Dependency Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Generate dependency graph
        run: |
          poetry show --tree > dependency-graph.txt

      - name: Upload dependency graph
        uses: actions/upload-artifact@v3
        with:
          name: dependency-graph
          path: dependency-graph.txt

  notify:
    name: Notify on Completion
    needs: [update-dependencies, security-audit, outdated-check, dependency-graph]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ needs.update-dependencies.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.outdated-check.result }}" == "success" && \
                "${{ needs.dependency-graph.result }}" == "success" ]]; then
            echo "All dependency checks completed successfully"
            exit 0
          else
            echo "Some dependency checks failed"
            exit 1
          fi