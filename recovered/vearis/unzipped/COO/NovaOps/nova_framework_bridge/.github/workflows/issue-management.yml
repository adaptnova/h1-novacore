name: Issue Management

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

jobs:
  triage:
    name: Issue Triage
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v3

      - name: Label issues
        uses: actions/labeler@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Add size labels
        uses: pascalgn/size-label-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "XS": "0-299",
              "S": "300-999",
              "M": "1000-1999",
              "L": "2000-4999",
              "XL": "5000+"
            }

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  stale:
    name: Stale Issue Management
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Close stale issues
        uses: actions/stale@v8
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed if no further activity occurs. Thank you
            for your contributions.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'pinned,security,bug,enhancement'
          exempt-pr-labels: 'pinned,security,work-in-progress'

  project:
    name: Project Board Management
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'

    steps:
      - name: Add to project board
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Move issue in project
        uses: alex-page/github-project-automation-plus@v0.8.3
        if: github.event.action == 'labeled'
        with:
          project: Nova Framework Bridge
          column: To Do
          repo-token: ${{ secrets.PROJECT_TOKEN }}

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request'
    needs: [triage, project]

    steps:
      - name: Check high priority
        id: check
        run: |
          if [[ "${{ contains(github.event.issue.labels.*.name, 'high-priority') || contains(github.event.pull_request.labels.*.name, 'high-priority') }}" == "true" ]]; then
            echo "is_high_priority=true" >> $GITHUB_OUTPUT
          else
            echo "is_high_priority=false" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        if: steps.check.outputs.is_high_priority == 'true'
        run: |
          echo "High priority issue/PR needs attention!"
          # Add notification logic here (e.g., Slack, email)

  cleanup:
    name: Repository Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Delete merged branches
        uses: actions/delete-merged-branches@v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Close duplicate issues
        uses: actions/close-duplicates@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment: >
            This issue appears to be a duplicate. Please check if your issue has already
            been reported before creating a new one. Closing as duplicate.

  metrics:
    name: Issue Metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Generate metrics
        run: |
          echo "# Issue Statistics" > issue_metrics.md
          echo "## Open Issues" >> issue_metrics.md
          gh api repos/${{ github.repository }}/issues?state=open | jq length >> issue_metrics.md
          echo "## Open PRs" >> issue_metrics.md
          gh api repos/${{ github.repository }}/pulls?state=open | jq length >> issue_metrics.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload metrics
        uses: actions/upload-artifact@v3
        with:
          name: issue-metrics
          path: issue_metrics.md