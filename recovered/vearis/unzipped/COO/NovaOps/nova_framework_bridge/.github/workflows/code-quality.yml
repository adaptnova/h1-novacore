name: Code Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/code-quality.yml'

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install

      - name: Check code formatting (black)
        run: |
          poetry run black --check .

      - name: Check import sorting (isort)
        run: |
          poetry run isort --check-only --diff .

      - name: Run type checking (mypy)
        run: |
          poetry run mypy src tests

      - name: Run linting (pylint)
        run: |
          poetry run pylint src tests

      - name: Run flake8
        run: |
          poetry run flake8 src tests

      - name: Check code complexity (radon)
        run: |
          poetry run radon cc src tests -a -s
          poetry run radon mi src tests -s

      - name: Check code cohesion (cohesion)
        run: |
          poetry run cohesion --directory src

      - name: Check for dead code (vulture)
        run: |
          poetry run vulture src tests

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Run security checks (bandit)
        run: |
          bandit -r src -c bandit.yaml

      - name: Check dependencies for known vulnerabilities (safety)
        run: |
          safety check

  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install radon xenon

      - name: Generate code metrics
        run: |
          mkdir -p metrics
          radon raw src tests > metrics/raw_metrics.txt
          radon cc src tests > metrics/complexity_metrics.txt
          radon mi src tests > metrics/maintainability_metrics.txt
          radon hal src tests > metrics/halstead_metrics.txt

      - name: Check complexity thresholds
        run: |
          xenon --max-absolute B --max-modules B --max-average A src tests

      - name: Upload metrics
        uses: actions/upload-artifact@v3
        with:
          name: code-metrics
          path: metrics/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  report:
    name: Generate Quality Report
    needs: [quality, security, metrics, coverage]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v3

      - name: Download metrics
        uses: actions/download-artifact@v3
        with:
          name: code-metrics
          path: metrics/

      - name: Download coverage report
        uses: actions/download-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Generate quality report
        run: |
          echo "# Code Quality Report" > quality_report.md
          echo "## Code Metrics" >> quality_report.md
          echo '```' >> quality_report.md
          cat metrics/*.txt >> quality_report.md
          echo '```' >> quality_report.md

          echo "## Coverage Report" >> quality_report.md
          echo "Coverage report available in artifacts" >> quality_report.md

      - name: Upload quality report
        uses: actions/upload-artifact@v3
        with:
          name: quality-report
          path: quality_report.md

      - name: Check quality gates
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]]; then
            echo "Code quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security checks failed"
            exit 1
          fi