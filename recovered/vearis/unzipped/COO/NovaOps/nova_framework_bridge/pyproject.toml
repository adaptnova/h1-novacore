[tool.poetry]
name = "nova-framework-bridge"
version = "0.1.0"
description = "A sophisticated bridge system enabling seamless integration between different AI frameworks and Nova's cognitive architecture"
authors = ["ADAPT.ai Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
redis = "^4.5.1"
pymongo = "^4.3.3"
neo4j = "^5.3.0"
milvus-sdk-python = "^2.2.8"
pyyaml = "^6.0.1"
aiohttp = "^3.8.5"
asyncio = "^3.4.3"
dataclasses-json = "^0.5.7"
langchain = "^0.0.200"
transformers = "^4.30.2"
python-json-logger = "^2.0.7"
prometheus-client = "^0.16.0"
opentelemetry-api = "^1.15.0"
opentelemetry-sdk = "^1.15.0"
opentelemetry-instrumentation = "^0.36b0"
cryptography = "^40.0.2"
python-jose = "^3.3.0"
passlib = "^1.7.4"
uvloop = "^0.17.0"
orjson = "^3.8.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.0.0"
pytest-mock = "^3.10.0"
pytest-xdist = "^3.3.1"
pytest-timeout = "^2.1.0"
pytest-randomly = "^3.13.0"
pytest-sugar = "^0.9.7"
pytest-html = "^3.2.0"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.3.0"
pylint = "^2.17.3"
flake8 = "^6.0.0"
bandit = "^1.7.5"
pre-commit = "^3.3.1"
sphinx = "^6.2.1"
sphinx-rtd-theme = "^1.2.0"
sphinx-autodoc-typehints = "^1.23.0"
sphinx-copybutton = "^0.5.2"
myst-parser = "^1.0.0"
ipython = "^8.14.0"
ipdb = "^0.13.13"
rich = "^13.4.2"
types-PyYAML = "^6.0.12.11"
types-redis = "^4.6.0.3"
types-requests = "^2.31.0.2"
typing-extensions = "^4.7.1"
locust = "^2.15.1"
memory-profiler = "^0.61.0"
line-profiler = "^4.0.3"
safety = "^2.3.5"
ochrona = "^2.0.2"
aioresponses = "^0.7.4"
responses = "^0.23.1"
moto = "^4.1.11"
watchdog = "^3.0.0"
python-dotenv = "^1.0.0"
click = "^8.1.3"
tqdm = "^4.65.0"
testing-postgresql = "^1.3.0"
testing-redis = "^1.1.1"
testing-mongodb = "^1.2.0"
testcontainers = "^3.7.1"
requests = "^2.31.0"
httpx = "^0.24.1"
pytest-benchmark = "^4.0.0"
asv = "^0.5.1"
radon = "^6.0.1"
xenon = "^0.9.0"
cohesion = "^1.0.0"
vulture = "^2.7"
pyroma = "^4.2"
commitizen = "^3.2.2"
tox = "^4.6.3"
nox = "^2023.4.22"
build = "^0.10.0"
twine = "^4.0.2"
wheel = "^0.40.0"

[tool.poetry.scripts]
nova-bridge = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "raise AssertionError",
]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "C0330",  # bad-continuation
    "C0326",  # bad-whitespace
]

[tool.pylint.format]
max-line-length = 88

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]