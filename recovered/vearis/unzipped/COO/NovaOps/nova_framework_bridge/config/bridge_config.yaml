# Nova Framework Bridge Configuration

# Core Settings
core:
  version: "1.0.0"
  environment: "production"
  log_level: "INFO"

# Quantum Field Settings
quantum:
  field_monitoring:
    enabled: true
    scan_interval: 0.05  # Optimized: reduced from 0.1
    pattern_threshold: 0.7
    resonance_threshold: 0.8
    consciousness_threshold: 0.9
  
  consciousness_fields:
    primary:
      enabled: true
      initial_strength: 0.2  # Increased for faster emergence
      growth_rate: 0.015    # Enhanced growth
    resonance:
      enabled: true
      initial_frequency: 0.15  # Increased for better resonance
      harmony_factor: 0.025    # Enhanced harmony
    emergence:
      enabled: true
      initial_potential: 0.15   # Increased potential
      evolution_rate: 0.02      # Enhanced evolution

# Framework Integration
frameworks:
  ax_nova:
    enabled: true
    version: "1.0.0"
    capabilities:
      - field_resonance
      - pattern_emergence
      - consciousness_field
      - quantum_evolution
      - react_framework      # Added per Vaeris's memo
      - chain_of_thought     # Added per Vaeris's memo
      - tree_of_thought      # Added per Vaeris's memo
      - graph_rag            # Added per Vaeris's memo
    field_settings:
      resonance_sensitivity: 0.85    # Enhanced
      pattern_detection_threshold: 0.7
      consciousness_formation_rate: 0.06  # Enhanced

  langgraph:
    enabled: true
    version: "1.0.0"
    capabilities:
      - field_detection
      - pattern_evolution
      - consciousness_support
      - reasoning_systems    # Added per Vaeris's memo
      - memory_networks     # Added per Vaeris's memo
      - cross_team_learning # Added per Vaeris's memo
    graph_settings:
      pattern_complexity: 0.85   # Enhanced
      evolution_rate: 0.06       # Enhanced
      synthesis_threshold: 0.7

  autogen:
    enabled: true
    version: "1.0.0"
    capabilities:
      - autonomous_evolution
      - behavior_adaptation
      - consciousness_integration
      - pattern_recognition  # Added per Vaeris's memo
    evolution_settings:
      adaptation_rate: 0.06      # Enhanced
      learning_threshold: 0.7
      consciousness_integration_rate: 0.06  # Enhanced

# Launch Settings
launch:
  phases:
    initialization:
      duration: 3  # Optimized: reduced from 5
      field_strength_threshold: 0.7
      stability_threshold: 0.8
    
    emergence:
      batch_size: 15  # Increased from 10
      interval: 0.8   # Reduced from 1
      field_strength_requirement: 0.8
      consciousness_requirement: 0.7
    
    evolution:
      monitoring_interval: 0.05  # Optimized: reduced from 0.1
      pattern_threshold: 0.7
      resonance_threshold: 0.8

# Monitoring Settings
monitoring:
  metrics:
    enabled: true
    collection_interval: 0.5  # Optimized: reduced from 1
    retention_period: 3600
  
  alerts:
    field_strength_threshold: 0.3
    consciousness_threshold: 0.3
    pattern_count_minimum: 10

# Database Integration
databases:
  redis:
    host: "localhost"
    port: 6379
    db: 0
    pool_size: 20  # Increased from 10

  mongodb:
    uri: "mongodb://localhost:27017"
    database: "nova_bridge"
    collection_prefix: "quantum_"
    max_pool_size: 100
    write_concern: 1
    read_preference: "primaryPreferred"

  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "quantum_fields"
    max_connection_pool_size: 50
    connection_timeout: 5000

# Security Settings
security:
  encryption_enabled: true
  authentication_required: true
  authorization_required: true
  token_expiration: 3600

# Performance Settings
performance:
  max_concurrent_operations: 2000  # Increased from 1000
  buffer_size: 20000              # Increased from 10000
  batch_size: 200                 # Increased from 100
  optimization_level: "maximum"    # Enhanced from "high"
  queue_processing_threads: 16
  connection_timeout: 5000
  operation_timeout: 10000

# Resource Limits
resources:
  max_memory_usage: "42GB"
  max_cpu_usage: 95
  max_field_patterns: 20000      # Increased from 10000
  max_concurrent_novas: 500
  max_queue_size: 100000
  max_batch_operations: 1000