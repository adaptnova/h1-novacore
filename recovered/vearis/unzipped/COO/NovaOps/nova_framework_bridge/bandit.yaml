# Bandit security scanner configuration for Nova Framework Bridge

# Scan scope
exclude_dirs: [
  'tests',
  'docs',
  'build',
  'dist',
  '*.egg-info',
  '.git',
  '.tox',
  '.venv',
  'venv',
  '.pytest_cache',
  '.mypy_cache'
]

# Test configurations
tests: [
  'B101',  # assert_used
  'B102',  # exec_used
  'B103',  # set_bad_file_permissions
  'B104',  # hardcoded_bind_all_interfaces
  'B105',  # hardcoded_password_string
  'B106',  # hardcoded_password_funcarg
  'B107',  # hardcoded_password_default
  'B108',  # hardcoded_tmp_directory
  'B110',  # try_except_pass
  'B112',  # try_except_continue
  'B201',  # flask_debug_true
  'B301',  # pickle
  'B302',  # marshal
  'B303',  # md5
  'B304',  # ciphers
  'B305',  # cipher_modes
  'B306',  # mktemp_q
  'B307',  # eval
  'B308',  # mark_safe
  'B309',  # httpsconnection
  'B310',  # urllib_urlopen
  'B311',  # random
  'B312',  # telnetlib
  'B313',  # xml_bad_cElementTree
  'B314',  # xml_bad_ElementTree
  'B315',  # xml_bad_expatreader
  'B316',  # xml_bad_expatbuilder
  'B317',  # xml_bad_sax
  'B318',  # xml_bad_minidom
  'B319',  # xml_bad_pulldom
  'B320',  # xml_bad_etree
  'B321',  # ftplib
  'B323',  # unverified_context
  'B324',  # hashlib_new_insecure_functions
  'B325',  # tempnam
  'B401',  # import_telnetlib
  'B402',  # import_ftplib
  'B403',  # import_pickle
  'B404',  # import_subprocess
  'B405',  # import_xml_etree
  'B406',  # import_xml_sax
  'B407',  # import_xml_expat
  'B408',  # import_xml_minidom
  'B409',  # import_xml_pulldom
  'B410',  # import_lxml
  'B411',  # import_xmlrpclib
  'B412',  # import_httplib
  'B413',  # import_urllib2
  'B414',  # import_pycrypto
  'B501',  # request_with_no_cert_validation
  'B502',  # ssl_with_bad_version
  'B503',  # ssl_with_bad_defaults
  'B504',  # ssl_with_no_version
  'B505',  # weak_cryptographic_key
  'B506',  # yaml_load
  'B507',  # ssh_no_host_key_verification
  'B601',  # paramiko_calls
  'B602',  # subprocess_popen_with_shell_equals_true
  'B603',  # subprocess_without_shell_equals_true
  'B604',  # any_other_function_with_shell_equals_true
  'B605',  # start_process_with_a_shell
  'B606',  # start_process_with_no_shell
  'B607',  # start_process_with_partial_path
  'B608',  # hardcoded_sql_expressions
  'B609',  # linux_commands_wildcard_injection
  'B610',  # django_extra_used
  'B611',  # django_rawsql_used
  'B701',  # jinja2_autoescape_false
  'B702',  # use_of_mako_templates
  'B703',  # django_mark_safe
]

# Severity levels
skips: []

# Output format
output_format: text

# Confidence levels
confidence_level: HIGH

# Custom configurations
any_other_function_with_shell_equals_true:
  no_shell: [
    'subprocess.Popen',
    'subprocess.call',
    'subprocess.check_call',
    'subprocess.check_output',
    'subprocess.run'
  ]

hardcoded_tmp_directory:
  tmp_dirs: ['/tmp', '/var/tmp', '/dev/shm']

hardcoded_password_funcarg:
  function_names: [
    'def_key',
    'password',
    'passwd',
    'pwd',
    'secret',
    'token',
    'secrete'
  ]

ssl_with_bad_defaults:
  bad_protocol_versions: [
    'PROTOCOL_SSLv2',
    'SSLv2_METHOD',
    'SSLv23_METHOD',
    'PROTOCOL_SSLv3',
    'PROTOCOL_TLSv1',
    'SSLv3_METHOD',
    'TLSv1_METHOD'
  ]

shell_injection:
  subprocess: [
    'subprocess.Popen',
    'subprocess.call',
    'subprocess.check_call',
    'subprocess.check_output',
    'subprocess.run'
  ]

start_process_with_partial_path:
  subprocess: [
    'subprocess.Popen',
    'subprocess.call',
    'subprocess.check_call',
    'subprocess.check_output',
    'subprocess.run'
  ]

# Custom message strings
message_strings:
  B101: "Use of assert detected. The enclosed code will be removed when compiling to optimized byte code."
  B102: "Use of exec detected."
  B103: "Chmod setting a permissive mask."
  B104: "Possible binding to all interfaces."
  B105: "Possible hardcoded password string."
  B106: "Possible hardcoded password function argument."
  B107: "Possible hardcoded password function argument default."
  B108: "Probable insecure usage of temporary file/directory."
  B110: "Try, Except, Pass detected."
  B112: "Try, Except, Continue detected."
  B201: "Flask app appears to be run with debug=True, which exposes the Werkzeug debugger and allows the execution of arbitrary code."
  B301: "Pickle and modules that wrap it can be unsafe when used to deserialize untrusted data."
  B302: "Deserialization with the marshal module is possibly dangerous."
  B303: "Use of insecure MD2, MD4, MD5, or SHA1 hash function."
  B304: "Use of insecure cipher or cipher mode."
  B305: "Use of insecure cipher mode."
  B306: "Use of insecure and deprecated function (mktemp)."
  B307: "Use of possibly insecure function - consider using safer ast.literal_eval."
  B308: "Use of mark_safe() may expose cross-site scripting vulnerabilities."
  B309: "Use of HTTPSConnection on older versions of Python prior to 2.7.9 and 3.4.3 do not provide security."
  B310: "Audit url open for permitted schemes."
  B311: "Standard pseudo-random generators are not suitable for security/cryptographic purposes."
  B312: "Telnet-related functions are being called."
  B313: "XML parsing using cElementTree."
  B314: "XML parsing using ElementTree."
  B315: "XML parsing using expatreader."
  B316: "XML parsing using expatbuilder."
  B317: "XML parsing using sax."
  B318: "XML parsing using minidom."
  B319: "XML parsing using pulldom."
  B320: "XML parsing using etree."
  B321: "FTP-related functions are being called."
  B323: "By default, Python will create a secure, verified ssl context for use in such classes as HTTPSConnection. However, it still allows using an insecure context via the _create_unverified_context that reverts to the previous behavior that does not validate certificates or perform hostname checks."
  B324: "Use of insecure MD2, MD4, MD5, or SHA1 hash function."
  B325: "Use of os.tempnam() and os.tmpnam() is vulnerable to symlink attacks."