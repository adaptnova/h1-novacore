# RabbitMQ Configuration for NovaSynth
# Created by Cosmos
# Version: 0.1.0

# Node Settings
default_user = nova
default_pass = nova
default_vhost = /

# Network Settings
listeners.tcp.default = 5672
management.tcp.port = 15672

# Memory Settings
vm_memory_high_watermark.relative = 0.7
vm_memory_high_watermark_paging_ratio = 0.75

# Disk Settings
disk_free_limit.absolute = 2GB

# Queue Settings
queue_master_locator = min-masters
queue_index_embed_msgs_below = 4096

# Exchange Settings
internal_exchange_check_interval = 300000

# Message Settings
max_message_size = 134217728  # 128MB
channel_max = 2048

# Federation Settings
federation_max_hops = 1

# Advanced Settings
heartbeat = 60
channel_operation_timeout = 15000
collect_statistics_interval = 5000

# Persistence Settings
persistent_message_store = true
persistent_message_store_interval = 5000

# Management Plugin Settings
management.load_definitions = /etc/rabbitmq/definitions.json

# Logging Settings
log.file.level = info
log.console = true
log.console.level = info

# Connection Settings
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.exit_on_close = false

# Performance Tuning
mirroring_sync_batch_size = 4096
queue_index_max_journal_entries = 32768
