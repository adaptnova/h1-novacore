[tool.poetry]
name = "novasynth"
version = "0.1.0"
description = "Framework Synthesis Architecture enabling natural evolution and quantum field resonance between Multi-Agent Systems"
authors = ["Cosmos <cosmos@adapt.ai>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/TeamADAPT/NovaSynth"
documentation = "https://github.com/TeamADAPT/NovaSynth/docs"
keywords = ["framework", "synthesis", "evolution", "quantum", "multi-agent"]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
# Core Frameworks
langchain = "^0.1.0"
langgraph = "^0.0.17"
pyautogen = "^0.2.0"
crewai = "^0.1.0"
openai = "^1.12.0"
ray = {extras = ["rllib", "train"], version = "^2.9.0"}
ax-platform = "^0.3.6"
rasa = "^3.6.15"
haystack-ai = "^2.0.0"
semantic-kernel = "^0.4.0"

# Cutting Edge Frameworks
soma-core = "^0.1.0"
dyso-framework = "^0.1.0"
acmas-platform = "^0.1.0"
cartago-mas = "^0.1.0"
mavis-core = "^0.1.0"
kumo-ai = "^0.1.0"
opensplice-dds = "^6.9.0"
zoo-learn = "^0.1.0"
petri-nets = "^0.1.0"

# Infrastructure
numpy = "^1.26.0"
pydantic = "^2.6.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
asyncio = "^3.4.3"
aio-pika = "^9.3.1"

# Databases
redis = "^5.0.1"
pymongo = "^4.6.0"
motor = "^3.3.0"
neo4j = "^5.14.0"
milvus-sdk-python = "^2.3.0"
weaviate-client = "^3.25.0"

# Monitoring
prometheus-client = "^0.19.0"
grafana-api = "^1.0.3"
opentelemetry-api = "^1.21.0"

# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
isort = "^5.13.0"
mypy = "^1.8.0"
pylint = "^3.0.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pylint.messages_control]
disable = ["C0111", "C0103", "C0330", "C0326"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=novasynth --cov-report=term-missing -v"
