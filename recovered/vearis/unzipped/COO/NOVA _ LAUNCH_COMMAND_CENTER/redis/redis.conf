# Basic configuration
port 6379
bind 127.0.0.1
daemonize no
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /data/xray/xx/nova_setup/logs/redis.log

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence configuration
dir /data/xray/xx/nova_setup/redis
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB persistence
save 900 1
save 300 10
save 60 10000

# AOF persistence
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Memory segments configuration
databases 16

# Performance tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511
io-threads 4
io-threads-do-reads yes

# Monitoring
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 128