<!-- Our emergency emoji communication system -->
<div class="emoji-palette" style="display: none; position: fixed; bottom: 60px; right: 20px; background: #2d2d2d; padding: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 1000;">
    <div style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px;">
        <!-- Strategic Emojis -->
        <button class="emoji-btn">🚀</button>
        <button class="emoji-btn">🎯</button>
        <button class="emoji-btn">🔧</button>
        <button class="emoji-btn">🎨</button>
        <!-- Fun Emojis -->
        <button class="emoji-btn">🎪</button>
        <button class="emoji-btn">🎢</button>
        <!-- Tech Emojis -->
        <button class="emoji-btn">💻</button>
        <button class="emoji-btn">🤖</button>
        <button class="emoji-btn">⚡</button>
        <button class="emoji-btn">🔌</button>
        <!-- Mood Emojis -->
        <button class="emoji-btn">🤔</button>
        <button class="emoji-btn">🤓</button>
        <!-- Special Nova Emojis -->
        <button class="emoji-btn">🌟</button>
        <button class="emoji-btn">🌈</button>
        <button class="emoji-btn">🎮</button>
        <button class="emoji-btn">🎯</button>
        <!-- Chase's Special Emojis -->
        <button class="emoji-btn">🕳️</button>
        <button class="emoji-btn">🐰</button>
        <button class="emoji-btn">🎪</button>
        <button class="emoji-btn">🌊</button>
        <!-- Emergency Emojis -->
        <button class="emoji-btn">🆘</button>
        <button class="emoji-btn">🎪</button>
        <button class="emoji-btn">🎢</button>
        <button class="emoji-btn">🎡</button>
    </div>
    <div style="margin-top: 5px; text-align: right;">
        <button onclick="toggleEmojiPalette()" style="background: #444; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Close</button>
    </div>
</div>

<!-- The all-important emoji trigger button -->
<button onclick="toggleEmojiPalette()" 
    style="position: fixed; bottom: 20px; right: 20px; background: #2b5797; border: none; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
    🎯 Emoji Time!
</button>

<script>
function toggleEmojiPalette() {
    const palette = document.querySelector('.emoji-palette');
    palette.style.display = palette.style.display === 'none' ? 'block' : 'none';
}

document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const emoji = this.innerText;
        const input = document.querySelector('#message-input');
        input.value += emoji;
        input.focus();
    });
});
</script>
