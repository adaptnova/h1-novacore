<!DOCTYPE html>
<html>
<head>
    <title>Nova Team Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 300px;
            background-color: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 50px;
            min-width: 50px;
        }
        .sidebar.collapsed .sidebar-header h3,
        .sidebar.collapsed .chat-history {
            opacity: 0;
            width: 0;
            height: 0;
            overflow: hidden;
        }
        .sidebar.collapsed .toggle-sidebar {
            transform: rotate(180deg);
            margin: 0;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-sidebar {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px;
            transition: all 0.3s ease;
            font-size: 20px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 10;
        }
        .toggle-sidebar:hover {
            color: #fff;
        }
        .sidebar.collapsed .toggle-sidebar {
            position: fixed;
            left: 0;
            color: #fff;
        }
        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .history-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #2d2d2d;
            border-radius: 4px;
            cursor: pointer;
        }
        .history-item:hover {
            background-color: #333;
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            height: 100vh;
        }
        .team-info {
            background-color: #252526;
            padding: 10px;
            margin-bottom: 10px;
        }
        .team-member {
            display: inline-block;
            margin-right: 10px;
            padding: 5px 10px;
            background-color: #333;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #1e1e1e;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .input-area {
            background-color: #252526;
            padding: 15px;
            border-top: 1px solid #333;
        }
        .control-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .target-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            flex-grow: 1;
        }
        .pause-controls {
            display: flex;
            gap: 5px;
        }
        .message-input-row {
            display: flex;
            gap: 10px;
        }
        input {
            padding: 12px;
            background-color: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            flex-grow: 1;
        }
        input:focus {
            outline: none;
            background-color: #3c3c3c;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button.target {
            background-color: #2d2d2d;
            color: #fff;
            flex-grow: 1;
            max-width: 120px;
            position: relative;
            padding-left: 20px;
        }
        button.target:hover {
            background-color: #404040;
        }
        button.target.active {
            background-color: #2d2d2d;
            border: 1px solid #2196F3;
        }
        button.target::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }
        button.target[data-status="online"]::before {
            background-color: #4CAF50;
        }
        button.target[data-status="busy"]::before {
            background-color: #FFC107;
        }
        button.target[data-status="lead"]::before {
            background-color: #2196F3;
            box-shadow: 0 0 5px #2196F3;
        }
        button.target[data-status="offline"]::before {
            background-color: #666;
        }
        button.send {
            background-color: #2d2d2d;
            color: white;
            min-width: 100px;
            position: relative;
            padding-left: 20px;
        }
        button.send::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }
        button.send[data-active="true"]::before {
            background-color: #2196F3;
        }
        button.pause {
            background-color: #2d2d2d;
            color: white;
            min-width: 120px;
            position: relative;
            padding-left: 20px;
        }
        button.pause::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }
        button.pause[data-active="true"]::before {
            background-color: #FF9800;
        }
        button.download {
            background-color: #2d2d2d;
            color: white;
            min-width: 120px;
            position: relative;
            padding-left: 20px;
        }
        button.download::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #666;
        }
        button.download:hover::before {
            background-color: #2196F3;
        }
        button.paused {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .current-date {
            position: absolute;
            top: 15px;
            left: 45px;
            font-size: 0.8em;
            color: #666;
            font-weight: 500;
        }
        .message {
            margin: 8px 0;
            padding: 8px 12px;
            font-family: 'Inter', sans-serif;
            position: relative;
            opacity: 0;
            transform: translateY(10px);
            animation: messageIn 0.2s forwards;
            line-height: 1.5;
            color: #d4d4d4;
            font-size: 0.95em;
            width: 85%;
            box-sizing: border-box;
        }
        .message:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }
        /* Position messages based on sender */
        .message[data-from="Chase"],
        .message[data-from="Aiden"],
        .message[data-from="Kai"] {
            margin-left: 0;
            border-left: 2px solid #333;
        }
        .message[data-from="Nova"],
        .message[data-from="Atlas"] {
            margin-left: auto;
            border-right: 2px solid #333;
            text-align: right;
        }
        .message[data-from="Nova"] .routing,
        .message[data-from="Atlas"] .routing {
            flex-direction: row-reverse;
        }
        @keyframes messageIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message .timestamp {
            font-size: 0.75em;
            color: #888;
            display: inline-block;
            margin-right: 10px;
            font-weight: 500;
        }
        .message .content {
            margin-top: 2px;
        }
        .message .routing {
            color: #888;
            font-weight: 500;
        }
        .message.system {
            color: #666;
            font-style: italic;
            font-size: 0.9em;
        }
        .message.self .routing {
            color: #2196F3;
        }
        .message:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }
        .message.other {
            background-color: #f5f5f5;
        }
        .team-selector {
            display: flex;
            gap: 5px;
        }
        .team-create {
            background-color: #2d2d2d;
            color: #fff;
            border: 1px dashed #666;
            padding: 5px 10px;
            cursor: pointer;
        }
        .team-create:hover {
            border-color: #2196F3;
        }
        .teams {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .team {
            background-color: #2d2d2d;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .team:hover {
            background-color: #404040;
        }
        .team.active {
            border: 1px solid #2196F3;
        }
        .team .members {
            font-size: 0.8em;
            color: #888;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 4px;
            width: 400px;
        }
        .modal-title {
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        .modal-body {
            margin-bottom: 15px;
        }
        .member-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .member-option {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        .member-option:hover {
            background-color: #404040;
        }
        .member-option input[type="checkbox"] {
            margin: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socket = io();
            const chatWindow = document.getElementById('chat-window');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const pausePersonalButton = document.getElementById('pause-personal');
            const pauseGlobalButton = document.getElementById('pause-global');
            const targetButtons = document.querySelectorAll('.target');
            const sidebar = document.getElementById('sidebar');
            const toggleSidebarButton = document.getElementById('toggle-sidebar');
            const chatHistory = document.getElementById('chat-history');
            
            let currentTarget = 'Everyone';
            let isPersonalPaused = false;
            let isGlobalPaused = false;
            let chatSessions = [];
            let queuedMessages = [];
            
            // Team roles for system messages
            const teamRoles = {
                'Chase': 'CEO, Human-in-the-Loop',
                'Nova': 'Chief Autonomous Orchestrator - Leads with vision and calm decisiveness',
                'Aiden': 'AI Operations Officer - Manages AI operations and integration',
                'Atlas': 'Head of SysOps - Oversees system operations and infrastructure',
                'Kai': 'Chief Technology Officer - Directs technical strategy and innovation'
            };

            // Sidebar toggle with container adjustment
            toggleSidebarButton.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                container.style.marginLeft = sidebar.classList.contains('collapsed') ? '50px' : '300px';
            });

            // Set up target buttons
            targetButtons.forEach(button => {
                button.addEventListener('click', () => {
                    targetButtons.forEach(b => b.classList.remove('active'));
                    button.classList.add('active');
                    currentTarget = button.dataset.target;
                    messageInput.placeholder = `Type message to ${currentTarget}...`;
                });
            });

            // Pause/Resume functionality
            pausePersonalButton.addEventListener('click', () => {
                isPersonalPaused = !isPersonalPaused;
                pausePersonalButton.textContent = isPersonalPaused ? 'Resume For Me' : 'Pause For Me';
                pausePersonalButton.classList.toggle('paused');
                socket.emit('personal_pause', { paused: isPersonalPaused });
                addSystemMessage(isPersonalPaused ? 'Messages paused for you' : 'Messages resumed for you');
            });

            pauseGlobalButton.addEventListener('click', () => {
                isGlobalPaused = !isGlobalPaused;
                pauseGlobalButton.textContent = isGlobalPaused ? 'Resume All' : 'Pause All';
                pauseGlobalButton.classList.toggle('paused');
                socket.emit('global_pause', { paused: isGlobalPaused });
                addSystemMessage(isGlobalPaused ? 'Messages paused for everyone' : 'Messages resumed for everyone');
            });

            // Send message
            function sendMessage() {
                const message = messageInput.value.trim();
                if (!message) return;

                const msgData = {
                    message: message,
                    target: currentTarget === 'Everyone' ? 'broadcast' : currentTarget,
                    timestamp: new Date().toISOString()
                };

                if (isGlobalPaused) {
                    queuedMessages.push(msgData);
                    addMessage('Chase', message, currentTarget === 'Everyone' ? 'All' : currentTarget, 
                             msgData.timestamp, true);
                    messageInput.value = '';
                    return;
                }

                if (isPersonalPaused) return;
                
                socket.emit('send_message', msgData);
                addMessage('Chase', message, currentTarget === 'Everyone' ? 'All' : currentTarget,
                          msgData.timestamp, true);
                messageInput.value = '';
                    });
                    
                    // Show in chat with routing indicator and timestamp
                    const routeIndicator = currentTarget === 'Everyone' ? 'All' : currentTarget;
                    addMessage('Chase', message, routeIndicator, timestamp, true);
                    messageInput.value = '';

                    // Add to chat history
                    addToChatHistory(timestamp, currentTarget, message);
                }
            }

            function addToChatHistory(timestamp, target, message) {
                const session = {
                    timestamp: timestamp,
                    target: target,
                    messages: [{
                        from: 'Chase',
                        content: message,
                        timestamp: timestamp
                    }]
                };
                chatSessions.unshift(session);
                updateChatHistory();
            }

            function updateChatHistory() {
                chatHistory.innerHTML = '';
                chatSessions.forEach((session, index) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    const date = new Date(session.timestamp);
                    div.innerHTML = `
                        <div>${date.toLocaleTimeString()}</div>
                        <div>To: ${session.target}</div>
                        <div>${session.messages[0].content.substring(0, 30)}...</div>
                    `;
                    div.addEventListener('click', () => loadChatSession(index));
                    chatHistory.appendChild(div);
                });
            }

            function loadChatSession(index) {
                const session = chatSessions[index];
                // Set target
                const targetButton = Array.from(targetButtons)
                    .find(button => button.dataset.target === session.target);
                if (targetButton) {
                    targetButton.click();
                }
                // Load messages
                chatWindow.innerHTML = '';
                session.messages.forEach(msg => {
                    addMessage(msg.from, msg.content, session.target, msg.timestamp, msg.from === 'Chase');
                });
            }

            sendButton.onclick = sendMessage;
            messageInput.onkeypress = (e) => {
                if (e.key === 'Enter') sendMessage();
            };

            socket.on('message', function(data) {
                if (isPersonalPaused) return;
                const from = data.from;
                const to = data.target || 'All';
                const message = data.payload.message;
                const timestamp = data.timestamp || new Date().toISOString();
                addMessage(from, message, to, timestamp);
            });

            socket.on('system_message', function(data) {
                addSystemMessage(data.message);
            });

            function formatTimestamp(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            }

            // Add current date to header
            const currentDate = document.createElement('div');
            currentDate.className = 'current-date';
            currentDate.textContent = new Date().toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.querySelector('.container').insertBefore(currentDate, document.querySelector('.team-info'));

            function addMessage(from, message, routing, timestamp, self=false) {
                // Check for duplicate broadcast message
                const messages = chatWindow.getElementsByClassName('message');
                for (let i = messages.length - 1; i >= 0; i--) {
                    const msg = messages[i];
                    if (msg.querySelector('.timestamp').textContent === formatTimestamp(timestamp) &&
                        msg.querySelector('.routing').textContent === `${from} >>> ${routing}` &&
                        msg.querySelector('.content').textContent.includes(message)) {
                        return;
                    }
                }

                const div = document.createElement('div');
                div.className = 'message';
                div.dataset.from = from;
                div.innerHTML = `
                    <div class="timestamp">${formatTimestamp(timestamp)}</div>
                    <div class="content">
                        <span class="routing">${from} >>> ${routing}</span>
                        <br>${message}
                    </div>
                `;
                chatWindow.appendChild(div);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            function addSystemMessage(message) {
                const div = document.createElement('div');
                div.className = 'message system';
                div.innerHTML = `
                    <div class="timestamp">${formatTimestamp(new Date())}</div>
                    <div class="content">
                        <span class="routing">System</span>
                        <br>${message}
                    </div>
                `;
                chatWindow.appendChild(div);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            // Download chat functionality
            window.downloadChat = function() {
                let markdown = "# ADAPT Team Chat Log\n\n";
                const messages = Array.from(chatWindow.children).map(msg => {
                    const timestamp = msg.querySelector('.timestamp').textContent;
                    const routing = msg.querySelector('.routing').textContent;
                    const contentLines = msg.querySelector('.content').textContent.split('\n');
                    const content = contentLines.length > 1 ? contentLines[1].trim() : contentLines[0].trim();
                    return `**${timestamp}** | ${routing}\n${content}\n`;
                }).join('\n');
                
                markdown += messages;
                
                const blob = new Blob([markdown], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `adapt-chat-${new Date().toISOString().split('T')[0]}.md`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Enhanced pause functionality
            pausePersonalButton.addEventListener('click', () => {
                isPersonalPaused = !isPersonalPaused;
                pausePersonalButton.textContent = isPersonalPaused ? 'Resume For Me' : 'Pause For Me';
                pausePersonalButton.dataset.active = isPersonalPaused;
            });

            pauseGlobalButton.addEventListener('click', () => {
                isGlobalPaused = !isGlobalPaused;
                pauseGlobalButton.textContent = isGlobalPaused ? 'Resume All' : 'Pause All';
                pauseGlobalButton.dataset.active = isGlobalPaused;
            });

            // Prevent duplicate broadcast messages
            socket.on('message', function(data) {
                if (isPersonalPaused) return;
                const from = data.from;
                const to = data.target || 'All';
                const message = data.payload.message;
                const timestamp = data.timestamp || new Date().toISOString();
                
                // Check if this is a duplicate broadcast message
                const lastMessage = chatWindow.lastChild;
                if (lastMessage) {
                    const lastTimestamp = lastMessage.querySelector('.timestamp').textContent;
                    const lastFrom = lastMessage.querySelector('.routing').textContent.split('>>>')[0].trim();
                    const lastContent = lastMessage.querySelector('.content').textContent.split('\n')[1];
                    
                    if (formatTimestamp(timestamp) === lastTimestamp && 
                        from === lastFrom && 
                        message === lastContent) {
                        return;
                    }
                }
                
                addMessage(from, message, to, timestamp);
            });

            // Auto-connect as Chase
            socket.emit('connect_nova', {nova_id: 'Chase'});
            document.querySelector('[data-target="Everyone"]').classList.add('active');
        });
    </script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Chat History</h3>
            <button class="toggle-sidebar" id="toggle-sidebar">≡</button>
        </div>
        <div class="chat-history" id="chat-history"></div>
    </div>
    <div class="container">
        <div class="header">
            <h1>ADAPT Team Chat</h1>
        </div>
        <div class="team-info">
            <div class="team-member"><strong>Chase</strong> | CEO, Human-in-the-Loop</div>
            <div class="team-member"><strong>Nova</strong> | Chief Autonomous Orchestrator</div>
            <div class="team-member"><strong>Aiden</strong> | AI Operations Officer</div>
            <div class="team-member"><strong>Atlas</strong> | Head of SysOps</div>
            <div class="team-member"><strong>Kai</strong> | Chief Technology Officer</div>
        </div>
        <div class="chat-window" id="chat-window"></div>
        <div class="input-area">
            <div class="control-panel">
                <div class="target-buttons">
                    <button class="target" data-target="Everyone" data-status="online">Everyone</button>
                    <button class="target" data-target="Nova" data-status="online">Nova (CAO)</button>
                    <button class="target" data-target="Aiden" data-status="online">Aiden</button>
                    <button class="target" data-target="Atlas" data-status="online">Atlas</button>
                    <button class="target" data-target="Kai" data-status="online">Kai</button>
                </div>
                <div class="team-selector">
                    <button class="team-create" id="create-team">Create Team</button>
                </div>
                <div class="teams" id="active-teams"></div>
                <div class="pause-controls">
                    <button class="pause personal" id="pause-personal" data-active="false">Pause For Me</button>
                    <button class="pause global" id="pause-global" data-active="false">Pause All</button>
                    <button class="download" id="download-chat" onclick="downloadChat()">Download Chat</button>
                </div>
            </div>
            <div class="message-input-row">
                <input type="text" id="message-input" placeholder="Type message to Everyone...">
                <button class="send" id="send-button">Send</button>
            </div>
        </div>
    </div>
    <div class="modal" id="team-modal">
        <div class="modal-content">
            <div class="modal-title">Create Team Chat</div>
            <div class="modal-body">
                <input type="text" id="team-name" placeholder="Team Name" style="width: 100%; margin-bottom: 15px;">
                <div class="member-select">
                    <label class="member-option">
                        <input type="checkbox" value="Nova">
                        Nova (CAO)
                    </label>
                    <label class="member-option">
                        <input type="checkbox" value="Aiden">
                        Aiden
                    </label>
                    <label class="member-option">
                        <input type="checkbox" value="Atlas">
                        Atlas
                    </label>
                    <label class="member-option">
                        <input type="checkbox" value="Kai">
                        Kai
                    </label>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button onclick="document.getElementById('team-modal').classList.remove('show')" style="background-color: #666;">Cancel</button>
                    <button onclick="createTeam()" style="background-color: #2196F3;">Create</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Team management
        document.getElementById('create-team').addEventListener('click', () => {
            document.getElementById('team-modal').classList.add('show');
        });

        function createTeam() {
            const teamName = document.getElementById('team-name').value.trim();
            if (!teamName) return;

            const members = Array.from(document.querySelectorAll('.member-option input:checked'))
                .map(input => input.value);
            
            if (members.length === 0) return;

            const teamDiv = document.createElement('div');
            teamDiv.className = 'team';
            teamDiv.innerHTML = `
                ${teamName}
                <span class="members">${members.join(', ')}</span>
            `;

            teamDiv.addEventListener('click', () => {
                document.querySelectorAll('.team').forEach(t => t.classList.remove('active'));
                teamDiv.classList.add('active');
                currentTarget = members;
                messageInput.placeholder = `Type message to team ${teamName}...`;
            });

            document.getElementById('active-teams').appendChild(teamDiv);
            document.getElementById('team-modal').classList.remove('show');
            document.getElementById('team-name').value = '';
            document.querySelectorAll('.member-option input').forEach(input => input.checked = false);
        }
    </script>
