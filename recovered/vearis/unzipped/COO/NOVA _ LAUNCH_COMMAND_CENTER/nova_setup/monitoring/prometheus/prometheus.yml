# Prometheus Configuration for ADAPT Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # Alertmanager configuration will be added here

# Rule files
rule_files:
  # Rules will be added here

# Scrape configurations
scrape_configs:
  # Vector Store Service
  - job_name: 'vector_store'
    static_configs:
      - targets: ['vector-store:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Supabase Service
  - job_name: 'supabase'
    static_configs:
      - targets: ['supabase:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # RabbitMQ Service
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis Service
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s