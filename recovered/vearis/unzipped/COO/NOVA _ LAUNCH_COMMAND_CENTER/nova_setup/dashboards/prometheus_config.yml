global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nova_gui'
    static_configs:
      - targets: ['localhost:8000']  # Our GUI metrics endpoint

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']  # Redis exporter

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['localhost:15692']  # RabbitMQ metrics

  # Node metrics for the host system
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']  # Node exporter

  # Our main GUI application on port 8501
  - job_name: 'streamlit_gui'
    static_configs:
      - targets: ['localhost:8501']

  # Flask web interface
  - job_name: 'flask_app'
    static_configs:
      - targets: ['localhost:5000']