# Kubernetes Deployment Configurations - agent-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-agent
  labels:
    app: llm-agent
spec:
  replicas: 5  # Current number of Nova agents
  selector:
    matchLabels:
      app: llm-agent
  template:
    metadata:
      labels:
        app: llm-agent
    spec:
      containers:
        - name: llm-agent-container
          image: yourdockerrepo/llm-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"
            - name: REDIS_HOST
              value: "redis://localhost"
            - name: CHROMADB_ENDPOINT
              value: "http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-agent-service
spec:
  selector:
    app: llm-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
