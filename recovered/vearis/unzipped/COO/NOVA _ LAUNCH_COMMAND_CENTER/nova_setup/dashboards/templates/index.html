<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Nova Dashboard</h1>
            <div class="status-indicator" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>
        </header>

        <div class="main-content">
            <div class="metrics-panel">
                <h2>System Metrics</h2>
                <div class="metric" id="connectedUsers">
                    <span class="metric-label">Connected Users:</span>
                    <span class="metric-value">0</span>
                </div>
                <div class="metric" id="messagesSent">
                    <span class="metric-label">Messages Sent:</span>
                    <span class="metric-value">0</span>
                </div>
                <div class="metric" id="messagesReceived">
                    <span class="metric-label">Messages Received:</span>
                    <span class="metric-value">0</span>
                </div>
            </div>

            <div class="agent-panel">
                <h2>Agent Status</h2>
                <div class="agent-list" id="agentList">
                    <!-- Agent status items will be added here dynamically -->
                </div>
            </div>

            <div class="message-panel">
                <h2>Message Center</h2>
                <div class="message-history" id="messageHistory"></div>
                <div class="message-input">
                    <select id="agentSelect">
                        <option value="Nova">Nova</option>
                        <option value="Aiden">Aiden</option>
                        <option value="Atlas">Atlas</option>
                        <option value="All">All Agents</option>
                    </select>
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <div class="services-panel">
            <h2>Services Status</h2>
            <div class="service" id="redisStatus">
                <span class="service-label">Redis:</span>
                <span class="service-status">Checking...</span>
            </div>
            <div class="service" id="rabbitmqStatus">
                <span class="service-label">RabbitMQ:</span>
                <span class="service-status">Checking...</span>
            </div>
            <div class="service" id="metricsStatus">
                <span class="service-label">Metrics:</span>
                <span class="service-status">Checking...</span>
            </div>
        </div>
    </div>

    <script>
        // Initialize Socket.IO connection
        const socket = io();

        // Connection status handling
        socket.on('connect', () => {
            document.getElementById('connectionStatus').innerHTML = `
                <span class="status-dot connected"></span>
                <span class="status-text">Connected</span>
            `;
        });

        socket.on('disconnect', () => {
            document.getElementById('connectionStatus').innerHTML = `
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            `;
        });

        // Message handling
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            const agent = document.getElementById('agentSelect').value;
            
            if (message.trim()) {
                socket.emit('message', {
                    agent: agent,
                    content: message
                });
                document.getElementById('messageInput').value = '';
            }
        }

        socket.on('message_status', (data) => {
            const messageHistory = document.getElementById('messageHistory');
            const status = data.status === 'sent' ? 'success' : 'error';
            const timestamp = new Date().toLocaleTimeString();
            
            messageHistory.innerHTML += `
                <div class="message ${status}">
                    <span class="timestamp">${timestamp}</span>
                    <span class="content">${data.content || data.error}</span>
                </div>
            `;
            messageHistory.scrollTop = messageHistory.scrollHeight;
        });

        // Service status updates
        function updateServiceStatus() {
            fetch('/health')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('redisStatus').innerHTML = `
                        <span class="service-label">Redis:</span>
                        <span class="service-status ${data.services.redis ? 'online' : 'offline'}">
                            ${data.services.redis ? 'Online' : 'Offline'}
                        </span>
                    `;
                    document.getElementById('rabbitmqStatus').innerHTML = `
                        <span class="service-label">RabbitMQ:</span>
                        <span class="service-status ${data.services.rabbitmq ? 'online' : 'offline'}">
                            ${data.services.rabbitmq ? 'Online' : 'Offline'}
                        </span>
                    `;
                    document.getElementById('metricsStatus').innerHTML = `
                        <span class="service-label">Metrics:</span>
                        <span class="service-status ${data.services.metrics ? 'online' : 'offline'}">
                            ${data.services.metrics ? 'Online' : 'Offline'}
                        </span>
                    `;
                    
                    // Update metrics
                    document.getElementById('connectedUsers').querySelector('.metric-value').textContent = 
                        data.metrics.connected_users;
                    document.getElementById('messagesSent').querySelector('.metric-value').textContent = 
                        data.metrics.messages_sent;
                    document.getElementById('messagesReceived').querySelector('.metric-value').textContent = 
                        data.metrics.messages_received;
                })
                .catch(error => console.error('Error fetching health status:', error));
        }

        // Update service status every 5 seconds
        setInterval(updateServiceStatus, 5000);
        // Initial status check
        updateServiceStatus();
    </script>
</body>
</html>
