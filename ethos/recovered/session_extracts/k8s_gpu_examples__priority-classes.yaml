<content># Priority Classes for GPU Workloads
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production-critical
value: 1000000
globalDefault: false
description: "Critical production workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: research-high
value: 800000
globalDefault: false
description: "High-priority research workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: development
value: 500000
globalDefault: false
description: "Development workloads"

# Resource Quotas
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: h100-prod-quota
  namespace: production
spec:
  hard:
    requests.nvidia.com/gpu: 64
    limits.nvidia.com/gpu: 64
    cpu: 1000
    memory: 4000Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: h100-research-quota
  namespace: research
spec:
  hard:
    requests.nvidia.com/gpu: 32
    limits.nvidia.com/gpu: 32
    cpu: 500
    memory: 2000Gi

# Storage Classes
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ml-storage-extreme
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-extreme
  replication-type: regional-pd
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

# Example GPU Training Job
---
apiVersion: batch/v1
kind: Job
metadata:
  name: h100-training
  namespace: production
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: ml-training
    spec:
      priorityClassName: production-critical
      containers:
      - name: training
        image: gcr.io/a-d-a-p-t/ml-training:latest
        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: "208"
            memory: "1872Gi"
          requests:
            nvidia.com/gpu: 8
            cpu: "208"
            memory: "1872Gi"
        volumeMounts:
        - name: training-data
          mountPath: /data
        - name: model-output
          mountPath: /output
      volumes:
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
      - name: model-output
        persistentVolumeClaim:
          claimName: model-output-pvc
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

# Example GPU Inference Service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      priorityClassName: production-critical
      containers:
      - name: inference
        image: gcr.io/a-d-a-p-t/ml-inference:latest
        resources:
          limits:
            nvidia.com/gpu: 2
            cpu: "52"
            memory: "468Gi"
          requests:
            nvidia.com/gpu: 2
            cpu: "52"
            memory: "468Gi"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: model-store
          mountPath: /models
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: model-store-pvc
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

# GPU Metrics Configuration
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: gpu-monitoring
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: ml-training
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: AlertPolicy
metadata:
  name: gpu-alerts
  namespace: monitoring
spec:
  conditions:
  - displayName: "High GPU Memory Usage"
    conditionThreshold:
      filter: "metric.type=\"custom.googleapis.com/gpu/memory_used\" AND resource.type=\"k8s_container\""
      aggregations:
      - alignmentPeriod: 300s
        crossSeriesReducer: REDUCE_MEAN
        perSeriesAligner: ALIGN_MEAN
      comparison: COMPARISON_GT
      thresholdValue: 90
      duration: 300s
  - displayName: "GPU Error Rate"
    conditionThreshold:
      filter: "metric.type=\"custom.googleapis.com/gpu/error_count\" AND resource.type=\"k8s_container\""
      aggregations:
      - alignmentPeriod: 60s
        crossSeriesReducer: REDUCE_SUM
        perSeriesAligner: ALIGN_RATE
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 0s

# Network Policies
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: ml-training
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9400
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: storage
    ports:
    - protocol: TCP
      port: 443
