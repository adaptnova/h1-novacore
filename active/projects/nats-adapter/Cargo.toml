[package]
name = "hermes-nats-adapter"
version = "0.1.0"
edition = "2021"
description = "Typed NATS adapter primitives for Hermes-backed Nova agents"
license = "MIT"

[dependencies]
async-nats = "0.45"
bytes = "1.11"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["time"] }
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
